<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1a1d21; --muted: #6b7280; --accent: #2563eb; --border: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --accent: #60a5fa; --border: #2d3139; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    #totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .tile { display: flex; flex-direction: column; }
    .tile span { color: var(--muted); font-size: 0.85rem; }
    .tile strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .tile.total strong { color: var(--accent); }
    form { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 8px; }
    input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); min-width: 0; }
    form button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    #error { color: #dc2626; min-height: 1.5em; margin: 8px 0 0; font-size: 0.9rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: grid; grid-template-columns: 90px 1fr auto auto 32px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: none; }
    li.empty { display: block; color: var(--muted); }
    .date { color: var(--muted); font-size: 0.85rem; }
    .tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .amt { font-variant-numeric: tabular-nums; text-align: right; }
    li button { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 0; }
    @media (max-width: 600px) {
      form { grid-template-columns: 1fr 1fr; }
      form input[name="description"] { grid-column: 1 / -1; }
      li { grid-template-columns: 1fr auto 32px; }
      .date, .tag { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>
    <section class="card" id="totals" aria-label="Totals"></section>
    <section class="card">
      <form id="expense-form">
        <input name="description" placeholder="Description" required />
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount (₱)" required />
        <select name="entity">
          <option>TRS</option>
          <option>Trace</option>
          <option>AI Lab</option>
        </select>
        <input name="date" type="date" />
        <button type="submit">Add</button>
      </form>
      <p id="error" role="alert"></p>
    </section>
    <section class="card"><ul id="list"></ul></section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
